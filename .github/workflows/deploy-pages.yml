name: Deploy workflow website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "skills/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Audit dependencies
        working-directory: website
        run: npm audit --audit-level=high

      - name: Package master skill
        run: |
          mkdir -p website/public/downloads
          (cd skills && zip -q -FS -r "../website/public/downloads/hgm-web-app.zip" "hgm-web-app")
          unzip -t website/public/downloads/hgm-web-app.zip
          unzip -p website/public/downloads/hgm-web-app.zip hgm-web-app/SKILL.md | cmp - skills/hgm-web-app/SKILL.md

      - name: Validate and build website
        working-directory: website
        env:
          VITE_REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: npm run check

      - name: Configure GitHub Pages
        if: github.event.repository.visibility == 'public'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload website
        if: github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        if: github.event.repository.visibility == 'public'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
